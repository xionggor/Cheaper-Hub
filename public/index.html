<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Friends Game Hub</title><link rel="stylesheet" href="/style.css"></head><body><main><header><div class="brand">🎲 Friends <span>Game Hub</span></div><div id="who"></div></header><section id="auth" class="panel"><h1>朋友游戏大厅</h1><p class="muted">创建账号，和朋友一起开黑</p><input id="username" placeholder="用户名（3–20字）" maxlength="20" autocomplete="username"><input id="password" type="password" placeholder="密码（至少8位）" autocomplete="current-password"><div class="buttons"><button id="login">登录</button><button id="register" class="secondary">注册账号</button></div></section><section id="lobby" class="hidden"><h1>游戏大厅</h1><div class="gamelist"><div class="game sel" data-game="dice"><div class="emoji">🎲</div><div><h2>大话骰 · Liar's Dice</h2><p class="muted">2–8 人 · 轮流叫点与质疑</p></div></div><div class="game" data-game="blackjack"><div class="emoji">🃏</div><div><h2>21点 · Blackjack</h2><p class="muted">1–8 人 · 对战机器人庄家</p></div></div></div><div class="panel"><h2>私人房间</h2><button id="create">创建新房间</button><div class="join"><input id="roomcode" maxlength="6" placeholder="输入6位房间码"><button id="join">加入房间</button></div></div></section><section id="room" class="hidden"><div class="panel"><div class="roomhead"><div><small class="muted">房间号码</small><h1 id="code">------</h1></div><div class="buttons"><button id="copy" class="secondary">复制邀请链接</button><button id="leave" class="secondary">← 返回大厅</button></div></div><p id="conn" class="notice"></p><div id="status" class="notice"></div><div id="gamename" class="muted"></div><div id="diceui"><h2>玩家 <span id="playercount"></span></h2><div id="players" class="players"></div><div id="waiting"><button id="ready">准备</button><button id="start" class="secondary" disabled>房主开始游戏</button></div><div id="playing" class="hidden"><h2>我的骰子</h2><div id="mydice" class="dice"></div><p id="turn" class="muted"></p><p id="bidinfo"></p><div class="bid"><label>数量 <input type="number" id="count" min="1" value="1"></label><label>点数 <select id="face"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></label></div><div class="buttons"><button id="bid">叫点</button><button id="challenge" class="danger">开骰 / 质疑</button></div></div><div id="finished" class="hidden"><h2 id="winner"></h2><button id="restart">再来一局</button></div><p class="muted">规则：1点不是万能点；相同数量只能提高点数；失败者失去一颗骰子。</p></div><div id="bj" class="hidden"><h2>🃏 21点 · 机器人庄家</h2><div class="dealerbox"><h3>庄家</h3><div id="dealerhand" class="cards"></div><p id="dealerinfo" class="muted"></p></div><h2>玩家 <span id="bjcount"></span></h2><div id="bjplayers" class="players"></div><div id="bjwaiting"><label>下注 <input type="number" id="bjbet" min="1" max="100" value="10"></label><button id="bjbetbtn">设置下注</button><div class="buttons"><button id="bjstart" class="secondary" disabled>房主开局</button></div><p class="muted">每人初始 100 筹码，下注 1–100；开局时未设置的按 10 自动计算。黑杰克赢 1.5 倍。</p></div><div id="bjacting"><p id="bjturn" class="muted"></p><div class="buttons"><button id="bjhit">要牌</button><button id="bjstand" class="secondary">停牌</button></div></div><div id="bjresult" class="hidden"><h2 id="bjwinner"></h2><div class="buttons"><button id="bjnext" class="secondary">再来一局</button><button id="bjreset" class="danger">重置筹码</button></div></div></div></div><div id="toast" role="status"></div></main><script type="module" src="/app.js"></script></body></html>

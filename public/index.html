<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Friends Game Hub</title><link rel="stylesheet" href="/style.css"></head><body><main><header><div class="brand">🎲 Friends <span>Game Hub</span></div><div id="who"></div></header><section id="auth" class="panel"><h1>朋友游戏大厅</h1><p class="muted">创建账号，和朋友一起玩大话骰</p><input id="username" placeholder="用户名（3–20字）" maxlength="20" autocomplete="username"><input id="password" type="password" placeholder="密码（至少8位）" autocomplete="current-password"><div class="buttons"><button id="login">登录</button><button id="register" class="secondary">注册账号</button></div></section><section id="lobby" class="hidden"><h1>游戏大厅</h1><div class="game"><div class="emoji">🎲</div><div><h2>大话骰 · Liar's Dice</h2><p class="muted">2–8 人 · 私人联机 · 轮流叫点与质疑</p></div></div><div class="panel"><h2>私人房间</h2><button id="create">创建新房间</button><div class="join"><input id="roomcode" maxlength="6" placeholder="输入6位房间码"><button id="join">加入房间</button></div></div></section><section id="room" class="hidden"><div class="panel"><div class="roomhead"><div><small class="muted">房间号码</small><h1 id="code">------</h1></div><button id="copy" class="secondary">复制邀请链接</button></div><div id="status" class="notice"></div><h2>玩家 <span id="playercount"></span></h2><div id="players" class="players"></div><div id="waiting"><button id="ready">准备</button><button id="start" class="secondary">房主开始游戏</button></div><div id="playing" class="hidden"><h2>我的骰子</h2><div id="mydice" class="dice"></div><p id="turn" class="muted"></p><p id="bidinfo"></p><div class="bid"><label>数量 <input type="number" id="count" min="1" value="1"></label><label>点数 <select id="face"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></label></div><div class="buttons"><button id="bid">叫点</button><button id="challenge" class="danger">开骰 / 质疑</button></div></div><div id="finished" class="hidden"><h2 id="winner"></h2><button id="restart">再来一局</button></div><p class="muted">规则：1点不是万能点；相同数量只能提高点数；失败者失去一颗骰子。</p></div></section><div id="toast" role="status"></div></main><script type="module" src="/app.js"></script></body></html>
